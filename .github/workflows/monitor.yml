name: Monitor citas DIAN

on:
  # Horario automático APAGADO: el portal pide reCAPTCHA antes de mostrar la
  # disponibilidad, así que una consulta automática no puede ver las citas.
  # schedule:
  #   - cron: '5 0,1,11-23 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'monitor = vigilar; diagnostico = una sola consulta con fotos de cada paso'
        type: choice
        options: [monitor, diagnostico]
        default: diagnostico

concurrency:
  group: monitor-${{ github.event.inputs.modo || 'monitor' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Vigilar citas
        env:
          TZ: America/Bogota
          MODO: ${{ github.event.inputs.modo || 'monitor' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATOS_CITA: ${{ secrets.DATOS_CITA }}
          CIUDAD: ${{ vars.CIUDAD || 'Medellín' }}
          PASOS: ${{ vars.PASOS }}
          INTERVALO_SEG: ${{ vars.INTERVALO_SEG || '150' }}
        run: node monitor.js

      - name: Guardar capturas del diagnóstico
        if: always() && github.event.inputs.modo == 'diagnostico'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: diagnostico/
          retention-days: 3
          if-no-files-found: ignore
