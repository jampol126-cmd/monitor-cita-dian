name: Recordatorio citas DIAN

on:
  # Horario apagado: el monitor automático ya avisa cuando hay cita.
  workflow_dispatch:   # botón "Run workflow" para probarlo

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enviar recordatorio
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATOS_CITA: ${{ secrets.DATOS_CITA }}
          CIUDAD: ${{ vars.CIUDAD || 'Medellín' }}
        run: node recordatorio.js
